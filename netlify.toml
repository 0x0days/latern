[build]
  command = "npm run build"
  publish = "dist"

# Single-page app: route every path to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The transcript index may be replaced — never serve a stale copy
[[headers]]
  for = "/transcripts.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Hashed assets are immutable — cache for a year
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
